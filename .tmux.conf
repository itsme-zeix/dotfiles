# --- Terminal ----------------------------------------------------------------

set -g default-terminal "tmux-256color"
# Truecolor, and extended keys from the outer terminal (kitty, ghostty, xterm).
set -as terminal-features ",xterm*:RGB:extkeys"

# Shift+Enter / Ctrl+Enter reach the agent as distinct keys (newline vs submit).
set -s extended-keys on
set -sq extended-keys-format csi-u         # tmux >= 3.5; Pi docs recommend it

# Let agents know when the pane gains or loses focus.
set -g focus-events on

# Short escape delay: Esc interrupts agents, so it must feel instant.
# Not 0, to avoid garbled Alt/escape sequences over slow SSH.
set -s escape-time 10

# OSC 52: copy from tmux or from the agent (e.g. /copy) to the system
# clipboard, also over SSH.
set -s set-clipboard on
# Pass images, hyperlinks, and notifications through to the outer terminal.
set -gq allow-passthrough on              # tmux >= 3.3

# --- General -----------------------------------------------------------------

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g status-interval 5
setw -g aggressive-resize on
# Killing a session avoids switching to another
set -g detach-on-destroy on

# Forward window titles to the outer terminal (tab title shows what's running).
set -g set-titles on
set -g set-titles-string "#S:#W #{pane_title}"

# --- Agent notifications -----------------------------------------------------
# Agents ring the bell when they finish or need input. Configure them to do so:
#   Claude Code: /config -> Notifications -> terminal bell
#   Codex:       [tui] notifications = true  in ~/.codex/config.toml
# A bell in a background window is highlighted in the status bar.
# Activity monitoring stays off; spinners would trigger it constantly.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
setw -g monitor-activity off

# prefix + A: toggle "alert when this window is quiet for 30s". Useful for
# agents that don't ring the bell when they finish.
bind A if -F "#{monitor-silence}" \
    "setw monitor-silence 0 ; display 'silence monitor off'" \
    "setw monitor-silence 30 ; display 'silence monitor on (30s)'"

# --- Keys --------------------------------------------------------------------

# Keep C-b as prefix (C-a is readline start-of-line, used in agent inputs).
# Press C-b twice to send C-b to the agent (Claude Code: background a command);
# this is a tmux default.

bind r source-file ~/.tmux.conf \; display "config reloaded"

# Splits and windows open in the current directory (usually the repo).
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation. Overrides prefix + l (last window); use
# prefix + Tab instead. Resize with the mouse or prefix + C-arrows.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# prefix + P: floating shell in the current directory, e.g. to check git diff
# while an agent runs. Exit the shell to close it.
bind P display-popup -E -w 85% -h 85% -d "#{pane_current_path}"

# --- Copy mode ---------------------------------------------------------------
# Native copy: hold Shift while dragging to select, then Cmd+C to copy.
# Keyboard copy: prefix + [, navigate with Vim keys, v to select, y to copy
# and exit. Search with /; quit with q.

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Left-click clears the selection while staying in copy mode.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
# Dragging selects text without overwriting the clipboard; press y to copy explicitly.
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# --- Look --------------------------------------------------------------------
# Catppuccin Mocha colours with the neutral grey background. Flat, no bold.
#   bar #252526   surface0 #313244   surface1 #45475a   overlay0 #6c7086
#   subtext0 #a6adc8   text #cdd6f4   blue #89b4fa   peach #fab387   yellow #f9e2af
#   mauve #cba6f7   red #f38ba8

# Show each pane's title on its border. Agents set the title to the current
# task, which helps tell several agents apart in one window.
setw -g pane-border-status top
setw -g pane-border-format " #P #{pane_current_command} #{?pane_title,· #{pane_title},} "
setw -g pane-border-style "fg=#45475a"
setw -g pane-active-border-style "fg=#89b4fa"

set -g status-style "bg=#252526,fg=#a6adc8"
# Session name, then a label for each active mode:
#   PREFIX  prefix key pressed, waiting for the next key (peach)
#   COPY    copy mode: pane frozen, keys go to tmux; q or Esc to exit (mauve)
#   VIEW    read-only output view, e.g. from a key binding; q to exit (mauve)
#   ZOOM    pane zoomed to fill the window; prefix + z to toggle (blue)
#   SYNC    typing goes to every pane in the window (red)
set -g status-left "#[fg=#89b4fa] #S #[default]\
#{?client_prefix,#[fg=#252526 bg=#fab387] PREFIX #[default] ,}\
#{?#{==:#{pane_mode},copy-mode},#[fg=#252526 bg=#cba6f7] COPY #[default] ,}\
#{?#{==:#{pane_mode},view-mode},#[fg=#252526 bg=#cba6f7] VIEW #[default] ,}\
#{?window_zoomed_flag,#[fg=#252526 bg=#89b4fa] ZOOM #[default] ,}\
#{?pane_synchronized,#[fg=#252526 bg=#f38ba8] SYNC #[default] ,} "
set -g status-left-length 60
set -g status-right "#[fg=#6c7086]#h  %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[fg=#cdd6f4 bg=#313244] #I:#W#F "
setw -g window-status-bell-style "fg=#252526,bg=#f9e2af"
setw -g window-status-activity-style "fg=#f9e2af"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"         # copy-mode selection
